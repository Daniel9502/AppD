<!DOCTYPE html>
<html lang="ro" data-theme="night">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1026" />
  <meta name="description" content="Fă o invitație frumoasă în 5 tap-uri și trimite-o. Rapid, simplu, cu zâmbet inclus." />
  <title>Hai să ne vedem 🌙</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text></svg>" />
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>

  <button id="theme-btn" class="theme-btn" type="button" aria-label="Schimbă între zi și noapte">
    <span id="theme-icon">🌙</span>
  </button>

  <div class="page">

    <!-- ============ VIEW 1: COMPOZITOR ============ -->
    <section id="view-compose" class="view">
      <header class="hero">
        <p class="eyebrow">✨ invitații în 5 tap-uri</p>
        <h1>Hai să ne vedem</h1>
        <p class="intro">Alegi, râzi, trimiți. Fără cont, fără instalare, fără scuze.</p>
      </header>

      <div class="card">
        <div class="name-row">
          <input type="text" id="senderName" placeholder="Numele tău" autocomplete="given-name"
                 enterkeyhint="done" maxlength="24" aria-label="Numele tău" />
          <button id="surprise-btn" class="btn btn-ghost btn-surprise" type="button">🎲 Surpriză</button>
        </div>

        <div id="chip-groups"></div>

        <button id="extra-toggle" class="note-toggle" type="button" aria-expanded="false">
          ➕ Detalii: transport, ținută, ce bem
        </button>
        <div id="extra-groups" class="extra-groups hidden"></div>

        <button id="note-toggle" class="note-toggle" type="button" aria-expanded="false">
          ➕ Adaugă un mesaj de la tine
        </button>
        <textarea id="note" class="note hidden" rows="2" maxlength="180"
                  placeholder="Scrie ceva scurt și dulce..." aria-label="Mesajul tău"></textarea>
      </div>

      <button id="tip-card" class="tip" type="button">
        <span class="tip-label">💡 pont pentru tine <span class="tip-more">atinge pentru altul</span></span>
        <span class="tip-text" id="tip-text"></span>
      </button>

      <div class="card preview-card">
        <p class="preview-label">așa arată invitația</p>
        <p class="preview" id="preview"></p>
      </div>

      <div class="actions-bar">
        <button id="send-btn" class="btn btn-primary btn-big" type="button">💌 Trimite invitația</button>
        <div class="actions-row">
          <button id="wa-btn" class="btn btn-ghost" type="button">WhatsApp</button>
          <button id="copy-btn" class="btn btn-ghost" type="button">Copiază linkul</button>
        </div>
      </div>
    </section>

    <!-- ============ VIEW 2: INVITAȚIA PRIMITĂ ============ -->
    <section id="view-invite" class="view hidden">
      <header class="hero hero-tight">
        <p class="eyebrow">📬 ai primit o invitație</p>
      </header>

      <div class="card invite-card">
        <p class="preview big" id="invite-text"></p>
      </div>

      <button id="guest-tip-card" class="tip" type="button">
        <span class="tip-label">💡 pont pentru tine <span class="tip-more">atinge pentru altul</span></span>
        <span class="tip-text" id="guest-tip-text"></span>
      </button>

      <div id="answer-buttons" class="answer-grid">
        <button class="btn btn-yes" type="button" data-answer="yes">🎉 DA!</button>
        <button class="btn btn-ghost" type="button" data-answer="neg">😄 Hai să negociem</button>
        <button class="btn btn-ghost" type="button" data-answer="late">🗓️ Da, dar altă dată</button>
        <button class="btn btn-ghost btn-quiet" type="button" data-answer="no">😅 Nu pot acum</button>
      </div>

      <div id="reply-panel" class="card hidden">
        <input type="text" id="recipientName" placeholder="Numele tău" maxlength="24"
               enterkeyhint="done" autocomplete="given-name" aria-label="Numele tău" />
        <div id="counter-groups"></div>
        <button id="reply-note-toggle" class="note-toggle" type="button" aria-expanded="false">
          ➕ Adaugă un mesaj
        </button>
        <textarea id="replyNote" class="note hidden" rows="2" maxlength="180"
                  placeholder="Scrie ceva..." aria-label="Mesajul tău"></textarea>

        <p class="preview-label">răspunsul tău</p>
        <p class="preview" id="reply-preview"></p>
      </div>

      <div id="reply-actions" class="actions-bar hidden">
        <button id="reply-send-btn" class="btn btn-primary btn-big" type="button">📤 Trimite răspunsul</button>
        <div class="actions-row">
          <button id="reply-wa-btn" class="btn btn-ghost" type="button">WhatsApp</button>
          <button id="reply-copy-btn" class="btn btn-ghost" type="button">Copiază</button>
        </div>
      </div>
    </section>

    <!-- ============ VIEW 3: RĂSPUNSUL PRIMIT ============ -->
    <section id="view-answer" class="view hidden">
      <header class="hero hero-tight">
        <p class="eyebrow" id="answer-eyebrow">💛 ai primit un răspuns</p>
        <h1 id="answer-title"></h1>
      </header>

      <div class="card">
        <p class="preview big" id="answer-text"></p>
      </div>

      <div class="actions-bar">
        <button id="new-btn" class="btn btn-ghost btn-big" type="button">✍️ Fă altă invitație</button>
      </div>
    </section>

  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="script.js" defer></script>
</body>
</html>
